name: Validate runner routing

# Manual dispatch is restricted by GitHub to repository writers. A dispatch on
# a feature branch explicitly trusts that revision on the persistent runner.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  validate:
    runs-on:
      group: Jetson
      labels: [self-hosted, Jetson]
    timeout-minutes: 10
    env:
      CI_CHECKOUT_DIR: ci-${{ github.run_id }}-${{ github.run_attempt }}-routing
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          path: ${{ env.CI_CHECKOUT_DIR }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check runner compatibility and workflow routing
        shell: bash
        working-directory: ${{ env.CI_CHECKOUT_DIR }}
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = ARM64
          uv sync --locked
          uv run --locked python -m unittest discover -s tests -v
      - name: Remove this run's checkout
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          [[ "$CI_CHECKOUT_DIR" =~ ^ci-[0-9]+-[0-9]+-routing$ ]]
          rm -rf -- "${GITHUB_WORKSPACE:?}/$CI_CHECKOUT_DIR"
